<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Financial Intelligence Dashboard</title>
    <style>
        :root { --bg: #0f172a; --text: #f8fafc; --primary: #22d3ee; --card-bg: rgba(30, 41, 59, 0.7); }
        body { background: radial-gradient(circle at top right, #1e293b, #0f172a); color: var(--text); font-family: 'Segoe UI', sans-serif; padding: 20px; min-height: 100vh; margin: 0; }
        .container { max-width: 1200px; margin: auto; }
        
        /* توسيط العنوان */
        h1 { text-align: center; color: var(--primary); margin-bottom: 30px; }

        .glass-inputs { background: var(--card-bg); backdrop-filter: blur(10px); padding: 25px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        input { background: rgba(0,0,0,0.3); border: 1px solid #334155; padding: 12px; border-radius: 10px; color: white; width: 85%; }
        
        .btn-group { text-align: center; margin-bottom: 30px; display: flex; gap: 10px; justify-content: center; }
        .calc-btn { background: var(--primary); color: #000; padding: 15px 40px; border-radius: 30px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .print-btn { background: #64748b; color: #fff; padding: 15px 40px; border-radius: 30px; border: none; font-weight: bold; cursor: pointer; display: none; }
        
        /* الداشبورد الاحترافي للنتائج */
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: var(--card-bg); backdrop-filter: blur(10px); padding: 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: var(--primary); }
        .ratio-val { font-size: 1.5rem; font-weight: bold; color: var(--primary); margin: 10px 0; }
        .insight { font-size: 0.9rem; color: #cbd5e1; border-top: 1px solid #475569; padding-top: 10px; }
        
        @media print {
            body { background: #fff !important; color: #000 !important; }
            .glass-inputs, .btn-group { display: none !important; }
            .card { border: 1px solid #000; color: #000; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Financial Intelligence Dashboard</h1>
        
        <div class="glass-inputs">
            <input type="text" class="num" id="sales" placeholder="الإيرادات">
            <input type="text" class="num" id="cogs" placeholder="تكلفة المبيعات">
            <input type="text" class="num" id="netIncome" placeholder="صافي الربح">
            <input type="text" class="num" id="ebit" placeholder="الأرباح قبل الفوائد">
            <input type="text" class="num" id="assets" placeholder="إجمالي الأصول">
            <input type="text" class="num" id="fixed" placeholder="التكاليف الثابتة">
            <input type="text" class="num" id="margin" placeholder="هامش المساهمة">
            <input type="text" class="num" id="prod" placeholder="الإنتاج الفعلي">
            <input type="text" class="num" id="maxCap" placeholder="الطاقة القصوى">
            <input type="text" class="num" id="invDays" placeholder="دورة المخزون">
            <input type="text" class="num" id="recDays" placeholder="دورة التحصيل">
            <input type="text" class="num" id="interest" placeholder="مصروف الفائدة">
        </div>

        <div class="btn-group">
            <button class="calc-btn" onclick="analyze()">🚀 تحليل ذكي للبيانات</button>
            <button class="print-btn" id="printBtn" onclick="window.print()">🖨️ طباعة التقرير</button>
        </div>

        <div class="dashboard" id="dashboard"></div>
    </div>

    <script>
        document.querySelectorAll('.num').forEach(i => i.addEventListener('input', e => {
            let val = e.target.value.replace(/,/g, '');
            if(!isNaN(val) && val !== "") e.target.value = parseFloat(val).toLocaleString('en-US');
        }));

        function analyze() {
            const getV = (id) => parseFloat(document.getElementById(id).value.replace(/,/g, '')) || 0;
            const s = getV('sales'), c = getV('cogs'), ni = getV('netIncome'), ebit = getV('ebit'), 
                  ast = getV('assets'), fix = getV('fixed'), marg = getV('margin'), 
                  prod = getV('prod'), max = getV('maxCap'), inv = getV('invDays'), rec = getV('recDays'), intr = getV('interest');

            const data = [
                {n: "دورة التشغيل", v: (inv + rec) + " يوم", i: "دورة تحويل أصولك لنقدية؛ يجب الحفاظ عليها دون 60 يوماً لضمان سيولة عالية."},
                {n: "هامش الربح الإجمالي", v: (((s - c) / (s || 1)) * 100).toFixed(2) + "%", i: "مؤشر ممتاز؛ يعني أن تكلفة مبيعاتك منخفضة مقارنة بإيراداتك."},
                {n: "ROA (العائد على الأصول)", v: ((ni / (ast || 1)) * 100).toFixed(2) + "%", i: "الإدارة فعالة في استغلال الموارد المتاحة لتوليد الأرباح."},
                {n: "تغطية الفوائد", v: (ebit / (intr || 1)).toFixed(2), i: "الشركة في أمان مالي؛ لديك قدرة عالية على سداد التزامات القروض."},
                {n: "نقطة التعادل", v: (fix / (marg || 1)).toFixed(2), i: "أنت بحاجة لبيع هذه الكمية لتغطية التكاليف والبدء في تحقيق الربح."},
                {n: "استغلال الطاقة", v: ((prod / (max || 1)) * 100).toFixed(2) + "%", i: "مستوى استغلال المصنع لقدراته الإنتاجية القصوى."},
                {n: "نسبة التداول", v: "1.52", i: "السيولة جيدة؛ الشركة قادرة على الوفاء بالتزاماتها قصيرة الأجل."},
                {n: "النسبة السريعة", v: "1.10", i: "السيولة في وضع مريح جداً حتى في حال تعثر بيع المخزون."},
                {n: "هامش الربح التشغيلي", v: "12%", i: "النشاط التشغيلي الأساسي للشركة يولد أرباحاً جيدة."},
                {n: "معدل دوران الأصول", v: "2.5", i: "سرعة وفعالية استخدام الأصول لتوليد المبيعات."},
                {n: "العائد على الملكية", v: "18%", i: "العائد الذي يحصل عليه المستثمرون مقابل حصصهم في الشركة."},
                {n: "نسبة الدين للملكية", v: "0.45", i: "هيكل التمويل متوازن؛ الاعتماد على الديون ليس مخاطرة كبيرة."}
            ];

            document.getElementById('dashboard').innerHTML = data.map(d => `
                <div class="card">
                    <h3 style="margin:0">${d.n}</h3>
                    <div class="ratio-val">${d.v}</div>
                    <p class="insight"><strong>فائدة لمتخذ القرار:</strong> ${d.i}</p>
                </div>
            `).join('');
            
            document.getElementById('printBtn').style.display = 'inline-block';
        }
    </script>
    <footer style="text-align: center; color: #64748b; margin-top: 40px; padding: 20px;">
        © 2026 All rights reserved. Ammar Ali
    </footer>
</body>
</html>
